name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag (for example, v1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Validate release tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
            throw "Release tag must be a version such as v1.2.3 or v1.2.3-rc.1."
          }

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build DeskBeam.slnx --configuration Release
      - name: Publish applications
        shell: pwsh
        run: |
          dotnet publish src/DeskBeam.Host/DeskBeam.Host.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/DeskBeam.Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/DeskBeam.Client/DeskBeam.Client.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/DeskBeam.Client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path packages | Out-Null
          Compress-Archive -Path publish/DeskBeam.Host/* -DestinationPath packages/DeskBeam.Host-win-x64.zip
          Compress-Archive -Path publish/DeskBeam.Client/* -DestinationPath packages/DeskBeam.Client-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DeskBeam-win-x64
          path: packages/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeskBeam-win-x64
          path: packages
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" packages/*.zip "${args[@]}"
